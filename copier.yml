_min_copier_version: "9.17.0"
_subdirectory: template
_message_after_copy: |
  已生成 {{ repo_owner }}/{{ repo_name }}。
  请先运行项目检查，再初始化 Git 并发布到 GitHub。

repo_owner:
  type: str
  help: GitHub 仓库所有者
  validator: >-
    {% if not (repo_owner | regex_search('^(?=.{1,39}$)[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$')) %}
    使用 1 到 39 位字母、数字或单个横杠，且横杠不能位于开头、结尾或连续出现。
    {% endif %}

repo_name:
  type: str
  help: GitHub 仓库名和 Python 分发包名
  default: nonebot-plugin-example
  validator: >-
    {% if not (repo_name | regex_search('^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,98}[A-Za-z0-9])?$')) %}
    使用 1 到 100 位字母、数字、点、横杠或下划线，且必须以字母或数字开头和结尾。
    {% endif %}

module_name:
  type: str
  help: Python 导入包名；不能与支持版本中的标准库顶层模块同名
  default: "{{ repo_name | lower | replace('-', '_') | replace('.', '_') }}"
  # 支持矩阵 3.11–3.14 的 sys.stdlib_module_names 并集；调整矩阵时同步更新。
  validator: >-
    {% set stdlib_modules = (
      '__future__ _abc _aix_support _android_support _apple_support _ast _ast_unparse _asyncio _bisect _blake2 _bootsubprocess _bz2 _codecs _codecs_cn _codecs_hk _codecs_iso2022 _codecs_jp _codecs_kr _codecs_tw _collections _collections_abc _colorize _compat_pickle _compression _contextvars _crypt _csv _ctypes _curses _curses_panel _datetime _dbm _decimal _elementtree _frozen_importlib _frozen_importlib_external _functools _gdbm _hashlib _heapq _hmac _imp _interpchannels _interpqueues _interpreters _io _ios_support _json _locale _lsprof _lzma _markupbase _md5 _msi _multibytecodec _multiprocessing _opcode _opcode_metadata _operator _osx_support _overlapped _pickle _posixshmem _posixsubprocess _py_abc _py_warnings _pydatetime _pydecimal _pyio _pylong _pyrepl _queue _random _remote_debugging _scproxy _sha1 _sha2 _sha256 _sha3 _sha512 _signal _sitebuiltins _socket _sqlite3 _sre _ssl _stat _statistics _string _strptime _struct _suggestions _symtable _sysconfig _thread _threading_local _tkinter _tokenize _tracemalloc _types _typing _uuid _warnings _weakref _weakrefset _winapi _wmi _zoneinfo _zstd '
      ~ 'abc aifc annotationlib antigravity argparse array ast asynchat asyncio asyncore atexit audioop base64 bdb binascii bisect builtins bz2 calendar cgi cgitb chunk cmath cmd code codecs codeop collections colorsys compileall compression concurrent configparser contextlib contextvars copy copyreg crypt csv ctypes curses dataclasses datetime dbm decimal difflib dis distutils doctest email encodings ensurepip enum errno faulthandler fcntl filecmp fileinput fnmatch fractions ftplib functools gc genericpath getopt getpass gettext glob graphlib grp gzip hashlib heapq hmac html http idlelib imaplib imghdr imp importlib inspect io ipaddress itertools json keyword lib2to3 linecache locale logging lzma mailbox mailcap marshal math mimetypes mmap modulefinder msilib msvcrt multiprocessing netrc nis nntplib nt ntpath nturl2path numbers opcode operator optparse os ossaudiodev pathlib pdb pickle pickletools pipes pkgutil platform plistlib poplib posix posixpath pprint profile pstats pty pwd py_compile pyclbr pydoc pydoc_data pyexpat queue quopri random re readline reprlib resource rlcompleter runpy sched secrets select selectors shelve shlex shutil signal site smtpd smtplib sndhdr socket socketserver spwd sqlite3 sre_compile sre_constants sre_parse ssl stat statistics string stringprep struct subprocess sunau symtable sys sysconfig syslog tabnanny tarfile telnetlib tempfile termios textwrap this threading time timeit tkinter token tokenize tomllib trace traceback tracemalloc tty turtle turtledemo types typing unicodedata unittest urllib uu uuid venv warnings wave weakref webbrowser winreg winsound wsgiref xdrlib xml xmlrpc zipapp zipfile zipimport zlib zoneinfo'
    ).split() %}
    {% if not (module_name | regex_search('^[a-z_][a-z0-9_]*$')) or module_name in ['and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'] %}
    使用小写字母、数字和下划线，不能以数字开头，也不能使用 Python 关键字。
    {% elif module_name in stdlib_modules %}
    不能与 Python 3.11–3.14 标准库或内置顶层模块同名。
    {% endif %}

author_name:
  type: str
  help: 包作者名
  default: "{{ repo_owner }}"
  validator: >-
    {% if not (author_name | regex_search('\S')) %}
    作者名不能为空。
    {% endif %}

author_email:
  type: str
  help: 包作者邮箱
  default: "{{ repo_owner }}@users.noreply.github.com"
  validator: >-
    {% if not (author_email | regex_search('^[^\s@]+@[^\s@]+$')) %}
    使用包含单个 @ 且不含空白的邮箱地址。
    {% endif %}

copyright_year:
  type: int
  help: MIT License 的版权年份
  default: "{{ '%Y' | strftime }}"
